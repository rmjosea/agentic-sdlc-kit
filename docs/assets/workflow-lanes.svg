<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%" role="img" aria-label="Change Lanes XS to XL and Risk Override Architecture">
  <defs>
    <linearGradient id="laneBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="350" rx="16" fill="url(#laneBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">
    30-Second Triage: Match Process to Risk &amp; Size (Tallas XS–XL)
  </text>
  <text x="36" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#94a3b8">
    Do not write specs for typos. Do not wing database migrations or auth changes in chat.
  </text>

  <!-- Lane 1: XS / S Lightweight Lane -->
  <g transform="translate(36, 88)">
    <rect width="352" height="190" rx="12" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="16" y="16" width="176" height="26" rx="6" fill="#14532d"/>
    <text x="26" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#86efac">⚡ LIGHTWEIGHT LANE</text>
    <text x="204" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#4ade80">Tallas XS · S</text>

    <text x="16" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#f8fafc">When all 5 safety checks pass:</text>
    <text x="16" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#cbd5e1">• No new API, schema, or contract</text>
    <text x="16" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#cbd5e1">• No acceptance-criteria behavior shift</text>
    <text x="16" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#cbd5e1">• No sensitive surface · Single PR</text>

    <rect x="16" y="146" width="320" height="30" rx="6" fill="#1e293b"/>
    <text x="26" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" fill="#6ee7b7">Flow: Repro Test -> Code -> Stack Juez -> PR</text>
  </g>

  <!-- Lane 2: M / L Spec Lane -->
  <g transform="translate(424, 88)">
    <rect width="352" height="190" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="16" y="16" width="136" height="26" rx="6" fill="#0c4a6e"/>
    <text x="26" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#7dd3fc">◆ SPEC LANE</text>
    <text x="164" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#38bdf8">Tallas M · L</text>

    <text x="16" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#f8fafc">New features &amp; cross-repo contracts:</text>
    <text x="16" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#cbd5e1">• Co-located features/{NNN}-{slug}/</text>
    <text x="16" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#cbd5e1">• Zero-invention api.md / data-model.md</text>
    <text x="16" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#cbd5e1">• Parallel Back/Front + Ring 1–2/3 Gate</text>

    <rect x="16" y="146" width="320" height="30" rx="6" fill="#1e293b"/>
    <text x="26" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" fill="#7dd3fc">Flow: Spec -> Plan -> Tasks -> Code -> Close</text>
  </g>

  <!-- Lane 3: XL Controlled Spec Lane -->
  <g transform="translate(812, 88)">
    <rect width="352" height="190" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="16" y="16" width="184" height="26" rx="6" fill="#78350f"/>
    <text x="26" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#fcd34d">⬢ CONTROLLED LANE</text>
    <text x="212" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#fbbf24">Talla XL / High Risk</text>

    <text x="16" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#f8fafc">Architecture, security &amp; regulated work:</text>
    <text x="16" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#cbd5e1">• ADR in architecture/adr/</text>
    <text x="16" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#cbd5e1">• Full Ring 1 + Ring 2 + Ring 3 E2E</text>
    <text x="16" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#cbd5e1">• Independent fresh-session review</text>

    <rect x="16" y="146" width="320" height="30" rx="6" fill="#1e293b"/>
    <text x="26" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" fill="#fcd34d">Flow: ADR + Spec Lane + Independent Audit</text>
  </g>

  <!-- Escape Hatch Banner -->
  <g transform="translate(36, 294)">
    <rect width="1128" height="38" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
    <text x="18" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#fca5a5">ESCAPE HATCH (RISK OVERRIDES SIZE):</text>
    <text x="315" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#e0e7ff">
      Auth, permissions, DB migrations, payments, PII, AI evals, or destructive ops always escalate to the Spec Lane.
    </text>
  </g>
</svg>
