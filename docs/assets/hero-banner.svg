<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%" role="img" aria-label="Agentic SDLC Kit — Evidence-Driven Engineering Harness for Coding Agents">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#131c33"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Outer Card Background -->
  <rect width="1200" height="380" rx="18" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect width="1200" height="380" rx="18" fill="url(#grid)"/>

  <!-- Top Accent Line -->
  <rect x="60" y="0" width="1080" height="3" rx="1.5" fill="url(#accentGrad)"/>

  <!-- Brand Badge / Logo Mark -->
  <g transform="translate(64, 42)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.75"/>
    <path d="M14 24 L21 31 L34 17" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="36" cy="14" r="3" fill="#38bdf8"/>
    <rect x="64" y="9" width="164" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="80" cy="24" r="4.5" fill="#34d399"/>
    <text x="93" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#e2e8f0" letter-spacing="0.6">KIT v2.1.0 · STDLIB</text>
  </g>

  <!-- Main Heading & Subtitle -->
  <text x="64" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-0.8">
    Agentic SDLC Kit
  </text>
  <text x="64" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="19.5" font-weight="400" fill="#94a3b8">
    Turn coding agents into disciplined engineers. Only the process you need, backed by real tests.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(64, 200)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="600">
    <rect x="0" y="0" width="195" height="30" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="14" y="20" fill="#7dd3fc">20 Skills (13 Default)</text>

    <rect x="209" y="0" width="190" height="30" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1.2"/>
    <text x="223" y="20" fill="#a5b4fc">XS–XL Change Lanes</text>

    <rect x="413" y="0" width="215" height="30" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
    <text x="427" y="20" fill="#6ee7b7">Dual Rubric + 3-Ring Gate</text>

    <rect x="642" y="0" width="225" height="30" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="656" y="20" fill="#fcd34d">Zero Runtime Dependencies</text>
  </g>

  <!-- Closed-Loop Pipeline Diagram at Bottom -->
  <g transform="translate(64, 256)">
    <!-- Step 1 -->
    <rect x="0" y="0" width="242" height="86" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    <text x="18" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#38bdf8">01 · TRIAGE &amp; DEFINE</text>
    <text x="18" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">Accepted Intent</text>
    <text x="18" y="69" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94a3b8">XS/S Direct · M–XL Spec</text>

    <!-- Connector 1 -->
    <path d="M246 43 L272 43" stroke="#475569" stroke-width="2"/>
    <polygon points="272,38 282,43 272,48" fill="#38bdf8"/>

    <!-- Step 2 -->
    <rect x="286" y="0" width="242" height="86" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    <text x="304" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#818cf8">02 · DESIGN &amp; SPLIT</text>
    <text x="304" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">Zero-Invention Plan</text>
    <text x="304" y="69" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94a3b8">plan.md + api.md -> T01..Tn</text>

    <!-- Connector 2 -->
    <path d="M532 43 L558 43" stroke="#475569" stroke-width="2"/>
    <polygon points="558,38 568,43 558,48" fill="#818cf8"/>

    <!-- Step 3 -->
    <rect x="572" y="0" width="242" height="86" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    <text x="590" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#f59e0b">03 · EXECUTE &amp; AUDIT</text>
    <text x="590" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">Test-First + Stack Juez</text>
    <text x="590" y="69" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94a3b8">Red -> Green -> Rubric Gate</text>

    <!-- Connector 3 -->
    <path d="M818 43 L844 43" stroke="#475569" stroke-width="2"/>
    <polygon points="844,38 854,43 844,48" fill="#34d399"/>

    <!-- Step 4 -->
    <rect x="858" y="0" width="214" height="86" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.4"/>
    <text x="876" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#34d399">04 · SEAL &amp; PROVE</text>
    <text x="876" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">3-Ring Evidence</text>
    <text x="876" y="69" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#6ee7b7">status: implemented ✓</text>
  </g>
</svg>
