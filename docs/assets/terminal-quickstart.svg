<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%" role="img" aria-label="Terminal Installation and Agent Chat Workflow Preview">
  <defs>
    <linearGradient id="winBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>

  <!-- Left Window: Terminal Installation -->
  <g transform="translate(10, 10)">
    <rect width="575" height="420" rx="14" fill="url(#winBg)" stroke="#334155" stroke-width="1.5"/>
    <rect width="575" height="38" rx="14" fill="#1e293b"/>
    <rect y="24" width="575" height="14" fill="#1e293b"/>
    <circle cx="22" cy="19" r="6" fill="#ef4444"/>
    <circle cx="42" cy="19" r="6" fill="#f59e0b"/>
    <circle cx="62" cy="19" r="6" fill="#22c55e"/>
    <text x="287" y="24" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" fill="#94a3b8">step 1 — terminal (install in 5 seconds)</text>

    <g transform="translate(24, 66)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
      <text x="0" y="0" fill="#64748b"># Install default profile (13 skills, zero external deps)</text>
      <text x="0" y="24" fill="#38bdf8">$</text>
      <text x="16" y="24" fill="#f8fafc">curl -fsSL https://raw.githubusercontent.com/rmjosea/</text>
      <text x="16" y="44" fill="#f8fafc">  agentic-sdlc-kit/main/install.sh | sh</text>

      <text x="0" y="80" fill="#34d399">✓ Preflight passed: clean Git root, no symlink traversal</text>
      <text x="0" y="102" fill="#34d399">✓ Installed AGENTS.md (L0 engineering contract)</text>
      <text x="0" y="124" fill="#34d399">✓ Installed 13 default skills under .agents/skills/</text>
      <text x="0" y="146" fill="#34d399">✓ Recorded SHA-256 manifest in .agents/agentic-sdlc-kit.json</text>

      <text x="0" y="186" fill="#64748b"># Or install everything + initialize .agents/project.json</text>
      <text x="0" y="210" fill="#38bdf8">$</text>
      <text x="16" y="210" fill="#f8fafc">npx github:rmjosea/agentic-sdlc-kit \</text>
      <text x="16" y="230" fill="#f8fafc">  --profile full --init-config</text>

      <text x="0" y="266" fill="#a5b4fc">✓ 20 skills + 4 modules (evidence, enforcement, multi-repo, compliance)</text>
      <text x="0" y="288" fill="#a5b4fc">✓ Created conservative .agents/project.json</text>

      <rect x="0" y="310" width="527" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="331" font-size="12" fill="#cbd5e1">Works with Claude Code, Cursor, GitHub Copilot, Codex &amp; Devin</text>
    </g>
  </g>

  <!-- Right Window: Agent Session -->
  <g transform="translate(615, 10)">
    <rect width="575" height="420" rx="14" fill="url(#winBg)" stroke="#334155" stroke-width="1.5"/>
    <rect width="575" height="38" rx="14" fill="#1e293b"/>
    <rect y="24" width="575" height="14" fill="#1e293b"/>
    <circle cx="22" cy="19" r="6" fill="#ef4444"/>
    <circle cx="42" cy="19" r="6" fill="#f59e0b"/>
    <circle cx="62" cy="19" r="6" fill="#22c55e"/>
    <text x="287" y="24" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" fill="#94a3b8">step 2 — your coding agent chat</text>

    <!-- User Prompt Bubble -->
    <g transform="translate(24, 56)">
      <rect width="527" height="62" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="14" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#38bdf8">YOU</text>
      <text x="14" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#f8fafc">"Read AGENTS.md. Route this request to the minimum safe lane:</text>
      <text x="14" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">Fix null crash in invoice tax rounding vs. Add webhook retry queue"</text>
    </g>

    <!-- Agent Response Bubble 1: Fast Lane -->
    <g transform="translate(24, 132)">
      <rect width="527" height="110" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.2"/>
      <text x="14" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#34d399">AGENT · CASE A: BUG FIX (TALLA S -> LIGHTWEIGHT LANE)</text>
      <text x="14" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e2e8f0">1. No spec/plan files needed. PR is the artifact.</text>
      <text x="14" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e2e8f0">2. Writing failing reproduction test first (RED -> GREEN).</text>
      <text x="14" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e2e8f0">3. Auditing diff against rubrics/python.md -> Verdict: APROBADO</text>
      <text x="14" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#6ee7b7">✓ Committed with git-conventions &amp; verified check output</text>
    </g>

    <!-- Agent Response Bubble 2: Spec Lane -->
    <g transform="translate(24, 256)">
      <rect width="527" height="142" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.2"/>
      <text x="14" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#a5b4fc">AGENT · CASE B: NEW FEATURE (TALLA M/L -> SPEC LANE)</text>
      <text x="14" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e2e8f0">1. drill-docs -> save-output -> judge-spec (1 question at a time)</text>
      <text x="14" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e2e8f0">2. plan-feature -> features/004-webhooks/plan.md + api.md + event.md</text>
      <text x="14" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e2e8f0">3. breakdown-tasks -> tasks.md (T01..T06 grouped by repo)</text>
      <text x="14" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e2e8f0">4. implement -> Cold-start loop + 3-Ring Verification Gate</text>
      <text x="14" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#c7d2fe">5. close-spec -> Notary check &amp; flip status: implemented ✓</text>
    </g>
  </g>
</svg>
